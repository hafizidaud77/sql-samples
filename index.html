
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafizi SQL Samples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f7fb;
            color: #243047;
        }

        h1 {
            color: #176b87;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #d5deea;
            text-align: left;
        }

        th {
            background: #176b87;
            color: white;
        }

        code {
            color: #16733c;
        }
    </style>
</head>
<body>
    <h1>Hafizi SQL Samples</h1>

    <h2>What is this?</h2>
    <p>A collection of SQL examples for learning and practice.</p>

    <h2>SQL Examples</h2>
    <table>
        <thead>
            <tr>
                <th>Keyword</th>
                <th>Example</th>
                <th>Comment</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>SELECT</td>
                <td><code>SELECT * FROM employees;</code></td>
                <td>Retrieve data from a table.</td>
            </tr>
            <tr>
                <td>WHERE</td>
                <td><code>SELECT * FROM employees WHERE id = 1;</code></td>
                <td>Filter rows based on a condition.</td>
            </tr>
        </tbody>
    </table>

</html>
